<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="120" fill="#1e1b4b"/>
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Letter C for CoFounderBay -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-weight="900" font-size="280" fill="white" text-anchor="middle">C</text>
  <!-- Small anchor/bay symbol -->
  <circle cx="256" cy="170" r="18" fill="white" opacity="0.3"/>
</svg>
